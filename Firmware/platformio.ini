; =====================================================================
;  Bristlebot -- PlatformIO
;  Alternative zur Arduino IDE. "pio run -t upload" genuegt, die
;  WebSocket-Bibliothek wird automatisch geholt.
; =====================================================================
[platformio]
src_dir = bristlebot

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework  = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    links2004/WebSockets @ ^2.4.1
    pololu/VL53L0X @ ^1.3.1

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1

; ---------------------------------------------------------------------
;  Zweite Umgebung: offizielle espressif32-Plattform mit Arduino-Core 2.x.
;  Dient als Gegenprobe -- die Firmware ist fuer Core 2.x und 3.x
;  ausgelegt, die umgestellte LEDC-API wird per #if abgefangen.
;  Nebeneffekt: diese Plattform braucht die penv-Einrichtung des
;  pioarduino-Forks nicht.
; ---------------------------------------------------------------------
[env:esp32dev_core2]
platform  = espressif32@6.9.0
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    links2004/WebSockets @ ^2.4.1
    pololu/VL53L0X @ ^1.3.1

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
